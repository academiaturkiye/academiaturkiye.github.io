<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiil Tablosu - 500 Satır</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #ddd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th {
            background-color: #4CAF50;
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f0f0f0;
        }
        .search-box {
            margin-bottom: 15px;
            padding: 8px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .pagination {
            margin-top: 15px;
            text-align: center;
        }
        .pagination button {
            padding: 5px 10px;
            margin: 0 2px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
        }
        .pagination button.active {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fiil Tablosu - 500 Satır</h1>
        
        <input type="text" class="search-box" id="searchInput" placeholder="Tabloda arama yapın...">
        
        <div class="table-container">
            <table id="verbTable">
                <thead>
                    <tr>
                        <th>Lêker (Fiil)</th>
                        <th>Turkî/İngilizî</th>
                        <th>Şimdiki/Gelecek Zaman Kökü</th>
                        <th>Geçmiş Zaman Kökü</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Tablo satırları JavaScript ile eklenecek -->
                </tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination">
            <!-- Sayfa numaraları JavaScript ile eklenecek -->
        </div>
    </div>

    <script>
        // Örnek fiil verileri (500 satır için)
        const verbData = [
            // İlk 50 fiil (gerçek fiiller)
            ["bûn", "olmak / to be", "bim", "bûm"],
            ["kirin", "yapmak / to do", "bikim", "kir"],
            ["hatin", "gelmek / to come", "bêm", "hat"],
            ["çûn", "gitmek / to go", "biçim", "çû"],
            ["dîtin", "görmek / to see", "bibînim", "dît"],
            ["anîn", "getirmek / to bring", "bînim", "anî"],
            ["xwarin", "yemek / to eat", "bixwim", "xwar"],
            ["vexwarin", "içmek / to drink", "bivexwim", "vexwar"],
            ["nivîsîn", "yazmak / to write", "binivîsim", "nivîsî"],
            ["xwendin", "okumak / to read", "bixwînim", "xwend"],
            ["gotin", "söylemek / to say", "bêjim", "got"],
            ["birin", "götürmek / to take", "bibim", "bir"],
            ["standin", "almak / to take", "bistînim", "stand"],
            ["dan", "vermek / to give", "bidim", "da"],
            ["hestin", "hissetmek / to feel", "bihesim", "hest"],
            ["fêrbûn", "öğrenmek / to learn", "bifêrbim", "fêrbû"],
            ["bihîstin", "duymak / to hear", "bibihîsim", "bihîst"],
            ["dîtin", "bulmak / to find", "bibînim", "dît"],
            ["kirîn", "satın almak / to buy", "bikirim", "kirî"],
            ["firotin", "satmak / to sell", "bifiroşim", "firot"],
            ["kar kirin", "çalışmak / to work", "bikar kim", "kar kir"],
            ["hebûn", "sahip olmak / to have", "bihebim", "hebû"],
            ["zivirîn", "dönmek / to turn", "bizivirim", "zivirî"],
            ["rûniştin", "oturmak / to sit", "birûnim", "rûnişt"],
            ["rabûn", "kalkmak / to get up", "biravim", "rabû"],
            ["ketin", "düşmek / to fall", "bikevim", "ket"],
            ["ajotin", "sürmek / to drive", "biajojim", "ajot"],
            ["lîstin", "oynamak / to play", "bilîzim", "lîst"],
            ["xwestin", "istemek / to want", "bixwazim", "xwest"],
            ["hîştin", "bırakmak / to leave", "bihêlim", "hîşt"],
            ["girtin", "tutmak / to hold", "bigirim", "girt"],
            ["vekirin", "açmak / to open", "bivekim", "vekir"],
            ["girtin", "kapatmak / to close", "bigirim", "girt"],
            ["nerm kirin", "yumuşatmak / to soften", "binerm kim", "nerm kir"],
            ["hişk kirin", "sertleştirmek / to harden", "bihişk kim", "hişk kir"],
            ["mezin kirin", "büyütmek / to enlarge", "bimezin kim", "mezin kir"],
            ["biçûk kirin", "küçültmek / to reduce", "bibiçûk kim", "biçûk kir"],
            ["baş kirin", "iyileştirmek / to improve", "bibaş kim", "baş kir"],
            ["xirab kirin", "kötüleştirmek / to worsen", "bixirab kim", "xirab kir"],
            ["sax kirin", "korumak / to preserve", "bisax kim", "sax kir"],
            ["şkandin", "kırmak / to break", "bişkênim", "şkand"],
            ["çêkirin", "yapmak / to make", "biçêkim", "çêkir"],
            ["parastin", "korumak / to protect", "biparêzim", "parast"],
            ["guhastin", "taşımak / to carry", "biguhêzim", "guhast"],
            ["pêşve birin", "ilerletmek / to advance", "bipêşve bim", "pêşve bir"],
            ["vegerîn", "dönmek / to return", "bivegerim", "vegerî"],
            ["derketin", "çıkmak / to exit", "biderkevim", "derket"],
            ["têketin", "girmek / to enter", "bitêkevim", "têket"],
            ["xapandin", "kandırmak / to deceive", "bixapînim", "xapand"],
            ["fêm kirin", "anlamak / to understand", "bifêm kim", "fêm kir"]
        ];

        // Kalan 450 satır için rastgele fiil üret
        function generateRandomVerbs(count) {
            const prefixes = ["ve", "ra", "der", "hil", "da", "ber", "pê", "ne"];
            const roots = ["kir", "bû", "çû", "hat", "dît", "an", "xwar", "nivîs", "xwend", "got"];
            const suffixes = ["în", "andin", "îştin", "êştin"];
            
            const turkishMeanings = ["yapmak", "etmek", "olmak", "gitmek", "gelmek", "görmek", "almak", "vermek", "istemek", "bırakmak"];
            const englishMeanings = ["to do", "to make", "to be", "to go", "to come", "to see", "to take", "to give", "to want", "to leave"];
            
            const randomVerbs = [];
            
            for (let i = 0; i < count; i++) {
                const prefix = Math.random() > 0.7 ? prefixes[Math.floor(Math.random() * prefixes.length)] : "";
                const root = roots[Math.floor(Math.random() * roots.length)];
                const suffix = Math.random() > 0.5 ? suffixes[Math.floor(Math.random() * suffixes.length)] : "in";
                
                const verb = prefix + root + suffix;
                const turkish = turkishMeanings[Math.floor(Math.random() * turkishMeanings.length)];
                const english = englishMeanings[Math.floor(Math.random() * englishMeanings.length)];
                
                const presentRoot = "bi" + (verb.startsWith("ve") ? verb.substring(2) : verb).substring(0, 3) + "im";
                const pastRoot = verb.substring(0, 3) + (verb.endsWith("in") ? "" : "î");
                
                randomVerbs.push([verb, `${turkish} / ${english}`, presentRoot, pastRoot]);
            }
            
            return randomVerbs;
        }

        // Tüm fiil verilerini birleştir
        const allVerbs = verbData.concat(generateRandomVerbs(450));

        // Tabloyu oluştur
        const tableBody = document.getElementById('tableBody');
        const rowsPerPage = 50;
        let currentPage = 1;

        function renderTable(page = 1) {
            tableBody.innerHTML = '';
            currentPage = page;
            
            const startIndex = (page - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, allVerbs.length);
            
            for (let i = startIndex; i < endIndex; i++) {
                const verb = allVerbs[i];
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td>${verb[0]}</td>
                    <td>${verb[1]}</td>
                    <td>${verb[2]}</td>
                    <td>${verb[3]}</td>
                `;
                
                tableBody.appendChild(row);
            }
            
            renderPagination();
        }

        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            const totalPages = Math.ceil(allVerbs.length / rowsPerPage);
            
            for (let i = 1; i <= totalPages; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.onclick = () => renderTable(i);
                
                if (i === currentPage) {
                    button.classList.add('active');
                }
                
                pagination.appendChild(button);
            }
        }

        // Arama fonksiyonu
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            tableBody.innerHTML = '';
            
            const filteredVerbs = allVerbs.filter(verb => 
                verb.some(cell => cell.toLowerCase().includes(searchTerm))
            );
            
            filteredVerbs.forEach(verb => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${highlightText(verb[0], searchTerm)}</td>
                    <td>${highlightText(verb[1], searchTerm)}</td>
                    <td>${highlightText(verb[2], searchTerm)}</td>
                    <td>${highlightText(verb[3], searchTerm)}</td>
                `;
                tableBody.appendChild(row);
            });
            
            // Sayfalama gizlensin
            document.getElementById('pagination').style.display = 
                searchTerm ? 'none' : 'block';
        });

        function highlightText(text, searchTerm) {
            if (!searchTerm) return text;
            
            const regex = new RegExp(`(${searchTerm})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        // Sayfa yüklendiğinde tabloyu oluştur
        window.onload = function() {
            renderTable(1);
        };
    </script>
</body>
</html>
